# Variante derrière un proxy Traefik.
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#
# Traefik joint le conteneur par le réseau Docker, sur son port interne : rien n'a besoin d'être
# publié sur l'hôte. Le `ports:` du fichier principal est donc annulé — le garder ouvrirait un
# second chemin vers l'application, hors du proxy, donc sans TLS ni middleware.
services:
  pg-advisor:
    # `!reset` et non une liste vide : Compose concatène les listes, et une liste vide laisserait
    # le port du fichier de base en place — donc le chemin hors proxy qu'on veut fermer.
    ports: !reset []

    networks:
      - default
      - traefik

    labels:
      traefik.enable: 'true'
      traefik.docker.network: '${TRAEFIK_NETWORK:-traefik}'
      traefik.http.routers.pg-advisor.rule: 'Host(`${ADVISOR_HOST:?ADVISOR_HOST est requis}`)'
      traefik.http.routers.pg-advisor.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.pg-advisor.tls.certresolver: '${TRAEFIK_CERTRESOLVER:-letsencrypt}'
      traefik.http.services.pg-advisor.loadbalancer.server.port: '8080'

    environment:
      # Le cookie de session part en Secure : la terminaison TLS est chez Traefik, et
      # l'application ne doit pas accepter que la session voyage en clair sur le lien public.
      PGADVISOR_Auth__RequireHttps: 'true'

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
