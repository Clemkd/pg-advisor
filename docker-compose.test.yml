# Instances PostgreSQL de test pour valider les règles et le principe zero-touch.
# L'une porte TimescaleDB et pg_stat_statements, l'autre est un PostgreSQL nu : l'Advisor doit
# rester utile sur les deux et n'activer les règles avancées que là où c'est possible.
#
#   docker compose -f docker-compose.test.yml up -d
#
services:
  pg-full:
    image: timescale/timescaledb:latest-pg17
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_PASSWORD: advisor-test
      POSTGRES_DB: shop
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  pg-bare:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: advisor-test
      POSTGRES_DB: billing
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Réceptacle de webhooks : renvoie la charge reçue et la journalise.
  webhook-echo:
    image: mendhak/http-https-echo:37
    environment:
      HTTP_PORT: 8888
    ports:
      - "58888:8888"
