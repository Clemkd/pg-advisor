id: extensions.hypopg-missing
version: 1

name: HypoPG is missing
description: >
  HypoPG creates hypothetical indexes and checks, through EXPLAIN, whether the planner would use
  them — without building the index.
category: extensions
severity: info
group: configuration

requires:
  missingExtensions:
    - hypopg

handler: capabilities.missing-extension

key:
  - extension

recommendation:
  title: "Install HypoPG to validate an index before creating it"
  message: >
    HypoPG is not available. Installing it would allow testing whether an index is worth building
    without actually building it.
  impact: low
  confidence: high
  evidence:
    - extension
    - installable
  sql: "CREATE EXTENSION hypopg;"
  documentation: https://hypopg.readthedocs.io/
