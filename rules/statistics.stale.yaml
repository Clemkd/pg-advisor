id: statistics.stale
version: 1

name: Stale statistics
description: >
  Old statistics on a table that has changed a great deal since lead the planner to under- or
  over-estimate volumes.
category: statistics
severity: info
group: recommendations

requires:
  views:
    - pg_stat_user_tables

parameters:
  maximum_days: 7
  minimum_modifications: 10000

query: |
  SELECT
    schemaname,
    relname,
    n_live_tup,
    n_mod_since_analyze,
    EXTRACT(EPOCH FROM (now() - GREATEST(last_analyze, last_autoanalyze))) / 86400
      AS days_since_analyze
  FROM pg_stat_user_tables
  WHERE (last_analyze IS NOT NULL OR last_autoanalyze IS NOT NULL)
    AND n_mod_since_analyze > @minimum_modifications
    AND GREATEST(last_analyze, last_autoanalyze) < now() - @maximum_days * INTERVAL '1 day'
  ORDER BY GREATEST(last_analyze, last_autoanalyze)
  LIMIT 200

condition: days_since_analyze > maximum_days

key:
  - schemaname
  - relname

recommendation:
  title: "Statistiques anciennes sur {{ schemaname }}.{{ relname }}"
  message: "Last analysed {{ days_since_analyze | round:1 }} days ago, with {{ n_mod_since_analyze | number }} modifications since."
  impact: medium
  confidence: medium
  evidence:
    - n_mod_since_analyze
    - days_since_analyze
  sql: "ANALYZE {{ schemaname }}.{{ relname }};"
  documentation: https://www.postgresql.org/docs/current/planner-stats.html
