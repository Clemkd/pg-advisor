id: timescaledb.uncompressed-chunks
version: 1

name: Old chunks left uncompressed
description: >
  Chunks whose window closed long ago and that are still uncompressed: either no policy is in
  place, or it is not keeping up.
category: timescaledb
severity: info
group: configuration

requires:
  extensions:
    - timescaledb
  views:
    - timescaledb_information.chunks

parameters:
  minimum_days: 7

limit: 50

query: |
  SELECT
    hypertable_schema,
    hypertable_name,
    chunk_name,
    range_end,
    is_compressed,
    EXTRACT(EPOCH FROM (now() - range_end)) / 86400 AS age_days
  FROM timescaledb_information.chunks
  WHERE range_end < now()
  ORDER BY range_end

condition: is_compressed == false and age_days > minimum_days

key:
  - hypertable_schema
  - chunk_name

recommendation:
  title: "Chunk uncompressed for {{ age_days | round }} days"
  message: "{{ chunk_name }} of hypertable {{ hypertable_name }} closed {{ age_days | round }} days ago and is not compressed."
  impact: medium
  confidence: medium
  evidence:
    - hypertable_name
    - range_end
    - age_days
  sql: "SELECT compress_chunk('{{ chunk_name }}');"
  documentation: https://docs.timescale.com/use-timescale/latest/compression/
