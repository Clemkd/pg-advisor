id: timescaledb.uncompressed-chunks
version: 2

name: Compression policy falling behind
description: >
  An hypertable whose compression is enabled but whose closed chunks are still uncompressed:
  the policy is missing, paused, or not keeping up with the ingest rate.
category: timescaledb
severity: info
group: configuration

requires:
  extensions:
    - timescaledb
  views:
    - timescaledb_information.chunks
    - timescaledb_information.hypertables

parameters:
  minimum_days: 7

query: |
  SELECT
    c.hypertable_schema,
    c.hypertable_name,
    count(*)                                                            AS stale_chunks,
    MAX(EXTRACT(EPOCH FROM (now() - c.range_end)) / 86400)              AS oldest_days,
    MIN(c.range_end)                                                    AS oldest_range_end
  FROM timescaledb_information.chunks c
  JOIN timescaledb_information.hypertables h
    ON h.hypertable_schema = c.hypertable_schema
   AND h.hypertable_name = c.hypertable_name
  WHERE c.range_end < now()
    AND c.is_compressed = false
    AND h.compression_enabled = true
  GROUP BY c.hypertable_schema, c.hypertable_name

condition: oldest_days > minimum_days

key:
  - hypertable_schema
  - hypertable_name

recommendation:
  title: "Compression behind on {{ hypertable_name }}"
  message: "{{ stale_chunks }} closed chunks of {{ hypertable_name }} are still uncompressed, the oldest for {{ oldest_days | round }} days."
  impact: medium
  confidence: medium
  evidence:
    - stale_chunks
    - oldest_days
    - oldest_range_end
  sql: |
    SELECT compress_chunk(chunk)
    FROM show_chunks('{{ hypertable_schema }}.{{ hypertable_name }}', older_than => INTERVAL '7 days') AS chunk;
  documentation: https://docs.timescale.com/use-timescale/latest/compression/
