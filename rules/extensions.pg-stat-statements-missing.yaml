id: extensions.pg-stat-statements-missing
version: 1

name: pg_stat_statements absente
description: >
  Sans cette extension, l'Advisor n'a aucune visibilité sur l'historique et le classement des
  requêtes. La règle ne se déclenche que si l'extension est absente et ne l'installe jamais.
category: extensions
severity: info
group: configuration

requires:
  missingExtensions:
    - pg_stat_statements

handler: capabilities.missing-extension

key:
  - extension

recommendation:
  title: "Installer pg_stat_statements pour analyser les requêtes"
  message: >
    pg_stat_statements n'est pas disponible. Son installation permettrait d'obtenir
    l'historique et le classement des requêtes par temps d'exécution.
  impact: medium
  confidence: high
  evidence:
    - extension
    - installable
  sql: |
    -- postgresql.conf : shared_preload_libraries = 'pg_stat_statements' (redémarrage requis)
    CREATE EXTENSION pg_stat_statements;
  documentation: https://www.postgresql.org/docs/current/pgstatstatements.html
