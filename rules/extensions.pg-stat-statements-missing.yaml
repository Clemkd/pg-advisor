id: extensions.pg-stat-statements-missing
version: 1

name: pg_stat_statements is missing
description: >
  Without this extension the Advisor has no visibility on query history or ranking. The rule only
  fires when the extension is absent, and never installs it.
category: extensions
severity: info
group: configuration

requires:
  missingExtensions:
    - pg_stat_statements

handler: capabilities.missing-extension

key:
  - extension

recommendation:
  title: "Install pg_stat_statements to analyse queries"
  message: >
    pg_stat_statements is not available. Installing it would provide query history and a ranking of
    queries by execution time.
  impact: medium
  confidence: high
  evidence:
    - extension
    - installable
  sql: |
    -- postgresql.conf: shared_preload_libraries = 'pg_stat_statements' (restart required)
    CREATE EXTENSION pg_stat_statements;
  documentation: https://www.postgresql.org/docs/current/pgstatstatements.html
