id: performance.sequential-scans
version: 2

name: Sequential scans on a large table
description: >
  A large table read mostly by full scans usually signals a missing index or a predicate that
  cannot use one.
category: performance
severity: warning
group: recommendations

requires:
  views:
    - pg_stat_user_tables

parameters:
  minimum_rows: 100000
  minimum_scans: 100
  sequential_share: 0.5
  minimum_rows_per_scan: 10000

query: |
  SELECT
    schemaname,
    relname,
    seq_scan,
    idx_scan,
    n_live_tup,
    seq_tup_read,
    seq_scan::float / NULLIF(seq_scan + COALESCE(idx_scan, 0), 0) AS seq_share,
    seq_tup_read::float / NULLIF(seq_scan, 0) AS rows_per_scan
  FROM pg_stat_user_tables
  WHERE n_live_tup > @minimum_rows
    AND seq_scan > @minimum_scans
    AND seq_scan::float / NULLIF(seq_scan + COALESCE(idx_scan, 0), 0) > @sequential_share
    AND seq_tup_read::float / NULLIF(seq_scan, 0) > @minimum_rows_per_scan
  ORDER BY seq_tup_read DESC
  LIMIT 200

condition: seq_share > sequential_share and rows_per_scan > minimum_rows_per_scan

key:
  - schemaname
  - relname

recommendation:
  title: "Frequent sequential scans on {{ schemaname }}.{{ relname }}"
  message: "{{ seq_share | percent }} of accesses to {{ relname }} are full scans, reading {{ rows_per_scan | number }} rows on average."
  impact: high
  confidence: medium
  evidence:
    - seq_scan
    - idx_scan
    - n_live_tup
    - rows_per_scan
  documentation: https://www.postgresql.org/docs/current/indexes.html
