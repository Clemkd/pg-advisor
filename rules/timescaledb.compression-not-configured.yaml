id: timescaledb.compression-not-configured
version: 2

name: Large hypertable without compression
description: >
  A hypertable past a certain volume with no compression enabled. Compression sharply reduces the
  space taken by historical data. Once it is enabled, a policy that falls behind is reported
  separately by timescaledb.uncompressed-chunks — the two describe distinct causes and never
  fire together on the same hypertable.
category: timescaledb
severity: info
group: configuration

requires:
  extensions:
    - timescaledb
  views:
    - timescaledb_information.hypertables

parameters:
  minimum_size_bytes: 1073741824

query: |
  SELECT
    hypertable_schema,
    hypertable_name,
    compression_enabled,
    num_chunks,
    hypertable_size(format('%I.%I', hypertable_schema, hypertable_name)::regclass) AS size_bytes
  FROM timescaledb_information.hypertables

condition: compression_enabled == false and size_bytes > minimum_size_bytes

key:
  - hypertable_schema
  - hypertable_name

recommendation:
  title: "Compression disabled on {{ hypertable_name }}"
  message: "{{ hypertable_name }} takes {{ size_bytes | bytes }} over {{ num_chunks }} chunks with no compression enabled."
  impact: medium
  confidence: medium
  evidence:
    - num_chunks
    - size_bytes
  sql: |
    ALTER TABLE {{ hypertable_schema }}.{{ hypertable_name }} SET (timescaledb.compress);
    SELECT add_compression_policy('{{ hypertable_schema }}.{{ hypertable_name }}', INTERVAL '30 days');
  documentation: https://docs.timescale.com/use-timescale/latest/compression/about-compression/
