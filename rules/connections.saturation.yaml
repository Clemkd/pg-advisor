id: connections.saturation
version: 1

name: Connection slots nearly exhausted
description: >
  Once the slots are saturated, new connections are refused, including the operator's. A pooler is
  almost always preferable to raising max_connections.
category: connections
severity: critical
group: health

requires:
  views:
    - pg_stat_activity
    - pg_settings

parameters:
  threshold: 0.85

# Several sub-queries aggregated into one row: the condition combines the columns with each other.
# Only client sessions are counted: those are what max_connections caps.
query: |
  SELECT
    (SELECT count(*) FROM pg_stat_activity WHERE backend_type = 'client backend')              AS used,
    (SELECT setting::int FROM pg_settings WHERE name = 'max_connections')                      AS max_connections,
    (SELECT setting::int FROM pg_settings WHERE name = 'superuser_reserved_connections')        AS reserved,
    (SELECT count(*) FROM pg_stat_activity
      WHERE backend_type = 'client backend' AND state = 'idle')                                AS idle

condition: used::float / (max_connections - reserved) > threshold

recommendation:
  title: "Connexions proches de la limit"
  message: "{{ used }} connections open out of {{ max_connections }} allowed, {{ idle }} of them idle. Consider PgBouncer before raising max_connections."
  impact: high
  confidence: high
  evidence:
    - used
    - max_connections
    - reserved
    - idle
  documentation: https://www.postgresql.org/docs/current/runtime-config-connection.html
