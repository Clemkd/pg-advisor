id: configuration.slow-query-logging
version: 1

name: Journalisation des requêtes lentes absente
description: >
  Sans log_min_duration_statement, aucune trace ne subsiste des requêtes lentes une fois
  l'incident passé.
category: configuration
severity: info
group: configuration

requires:
  views:
    - pg_settings

query: |
  SELECT
    setting::int AS log_min_duration
  FROM pg_settings
  WHERE name = 'log_min_duration_statement'

condition: log_min_duration < 0

recommendation:
  title: "Requêtes lentes non journalisées"
  message: "log_min_duration_statement vaut {{ log_min_duration }} : aucune requête lente n'est tracée. Une valeur de 1000 (ms) est un point de départ courant."
  impact: low
  confidence: high
  evidence:
    - log_min_duration
  sql: "ALTER SYSTEM SET log_min_duration_statement = '1s'; SELECT pg_reload_conf();"
  documentation: https://www.postgresql.org/docs/current/runtime-config-logging.html#GUC-LOG-MIN-DURATION-STATEMENT
