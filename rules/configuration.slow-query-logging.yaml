id: configuration.slow-query-logging
version: 1

name: Slow query logging is off
description: >
  Without log_min_duration_statement, no trace of slow queries survives once the incident is over.
category: configuration
severity: info
group: configuration

requires:
  views:
    - pg_settings

query: |
  SELECT
    setting::int AS log_min_duration
  FROM pg_settings
  WHERE name = 'log_min_duration_statement'

condition: log_min_duration < 0

recommendation:
  title: "Slow queries are not logged"
  message: "log_min_duration_statement is {{ log_min_duration }}: no slow query is traced. 1000 (ms) is a common starting point."
  impact: low
  confidence: high
  evidence:
    - log_min_duration
  sql: "ALTER SYSTEM SET log_min_duration_statement = '1s'; SELECT pg_reload_conf();"
  documentation: https://www.postgresql.org/docs/current/runtime-config-logging.html#GUC-LOG-MIN-DURATION-STATEMENT
