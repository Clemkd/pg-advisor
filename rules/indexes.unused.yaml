id: indexes.unused
version: 1

name: Index never used
description: >
  An index not scanned since statistics were last reset costs write time and space without
  speeding anything up. Check how old the statistics are before concluding.
category: indexes
severity: info
group: recommendations

requires:
  views:
    - pg_stat_user_indexes
    - pg_index

parameters:
  minimum_size_bytes: 8388608

query: |
  SELECT
    s.schemaname,
    s.relname,
    s.indexrelname,
    s.idx_scan,
    pg_relation_size(s.indexrelid) AS index_bytes
  FROM pg_stat_user_indexes s
  JOIN pg_index i ON i.indexrelid = s.indexrelid
  WHERE NOT i.indisunique
    AND NOT i.indisprimary
    AND pg_relation_size(s.indexrelid) > @minimum_size_bytes
  ORDER BY pg_relation_size(s.indexrelid) DESC

condition: idx_scan == 0

key:
  - schemaname
  - indexrelname

recommendation:
  title: "Unused index: {{ indexrelname }}"
  message: "{{ indexrelname }} on {{ schemaname }}.{{ relname }} takes {{ index_bytes | bytes }} and has never been scanned."
  impact: low
  confidence: medium
  evidence:
    - idx_scan
    - index_bytes
  sql: "DROP INDEX CONCURRENTLY {{ schemaname }}.{{ indexrelname }};"
  documentation: https://www.postgresql.org/docs/current/monitoring-stats.html
