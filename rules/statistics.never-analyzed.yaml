id: statistics.never-analyzed
version: 2

name: Table never analysed
description: >
  Without ANALYZE the planner works from default estimates and frequently picks unsuitable plans.
category: statistics
severity: warning
group: recommendations

requires:
  views:
    - pg_stat_user_tables

parameters:
  minimum_rows: 1000

query: |
  SELECT
    schemaname,
    relname,
    n_live_tup,
    last_analyze,
    last_autoanalyze
  FROM pg_stat_user_tables
  WHERE n_live_tup > @minimum_rows
    AND last_analyze IS NULL
    AND last_autoanalyze IS NULL
  ORDER BY n_live_tup DESC
  LIMIT 200

condition: last_analyze is null and last_autoanalyze is null

key:
  - schemaname
  - relname

recommendation:
  title: "Statistiques absentes sur {{ schemaname }}.{{ relname }}"
  message: "{{ relname }} holds {{ n_live_tup | number }} rows and has never been analysed."
  impact: high
  confidence: high
  evidence:
    - n_live_tup
  sql: "ANALYZE {{ schemaname }}.{{ relname }};"
  documentation: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-STATISTICS
