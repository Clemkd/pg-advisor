id: storage.temp-files
version: 2

name: Large temporary files
description: >
  Temporary files are written when sorts, hashes or aggregates spill out of work_mem onto disk.
category: storage
severity: warning
group: statistics

requires:
  views:
    - pg_stat_database

parameters:
  maximum_bytes: 1073741824

query: |
  SELECT
    datname,
    temp_files,
    temp_bytes,
    temp_bytes / NULLIF(temp_files, 0) AS bytes_per_file
  FROM pg_stat_database
  WHERE datname = current_database()

condition: temp_bytes_delta > maximum_bytes

recommendation:
  title: "{{ temp_bytes | bytes }} written to temporary files"
  message: "{{ temp_bytes_delta | bytes }} spilled to temporary files since the previous measurement, out of {{ temp_bytes | bytes }} since the last statistics reset. A larger work_mem would avoid these spills."
  impact: medium
  confidence: medium
  evidence:
    - temp_bytes_delta
    - temp_files
    - temp_bytes
    - bytes_per_file
  documentation: https://www.postgresql.org/docs/current/runtime-config-resource.html#GUC-WORK-MEM
