id: bloat.table-estimate
version: 1

name: Estimated table bloat
description: >
  Estimates the gap between the table's actual size and the theoretical size of its rows, from
  planner statistics. This is an estimate: pgstattuple gives the exact measure, at the cost of a
  full read.
category: bloat
severity: warning
group: configuration

requires:
  views:
    - pg_class
    - pg_stats

parameters:
  minimum_ratio: 0.3
  minimum_pages: 1000

query: |
  WITH largeurs AS (
    SELECT
      c.oid,
      n.nspname                                            AS schemaname,
      c.relname,
      c.reltuples,
      c.relpages,
      current_setting('block_size')::numeric               AS bs,
      SUM((1 - COALESCE(s.null_frac, 0)) * COALESCE(s.avg_width, 1024)) AS largeur_ligne
    FROM pg_class c
    JOIN pg_namespace n ON n.oid = c.relnamespace
    LEFT JOIN pg_stats s ON s.schemaname = n.nspname AND s.tablename = c.relname
    WHERE c.relkind = 'r'
      AND n.nspname NOT IN ('pg_catalog', 'information_schema', 'pg_toast')
      AND c.reltuples > 0
      AND c.relpages > @minimum_pages
    GROUP BY c.oid, n.nspname, c.relname, c.reltuples, c.relpages
  )
  SELECT
    schemaname,
    relname,
    relpages,
    reltuples,
    largeur_ligne,
    pg_relation_size(oid)                                                          AS size_bytes,
    CEIL(reltuples * (largeur_ligne + 24) / (bs - 24))                             AS expected_pages,
    GREATEST(relpages - CEIL(reltuples * (largeur_ligne + 24) / (bs - 24)), 0) * bs AS wasted_bytes,
    1 - (CEIL(reltuples * (largeur_ligne + 24) / (bs - 24)) / NULLIF(relpages, 0))  AS wasted_ratio
  FROM largeurs
  WHERE largeur_ligne IS NOT NULL
  ORDER BY wasted_bytes DESC
  LIMIT 500

condition: wasted_ratio > minimum_ratio

key:
  - schemaname
  - relname

recommendation:
  title: "About {{ wasted_ratio | percent }} bloat on {{ schemaname }}.{{ relname }}"
  message: "{{ relname }} takes {{ size_bytes | bytes }} for {{ expected_pages | number }} expected pages, so {{ wasted_bytes | bytes }} is potentially reclaimable."
  impact: medium
  confidence: low
  evidence:
    - relpages
    - expected_pages
    - wasted_bytes
    - wasted_ratio
  sql: |
    -- Takes an exclusive lock; pg_repack avoids it
    VACUUM FULL {{ schemaname }}.{{ relname }};
  documentation: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-SPACE-RECOVERY
