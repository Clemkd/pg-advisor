id: queries.slowest-mean-time
version: 1

name: Queries slow on average
description: >
  Queries ranked by mean execution time. Depends on pg_stat_statements: the rule is skipped where
  the extension is absent.
category: queries
severity: warning
group: recommendations

requires:
  extensions:
    - pg_stat_statements
  views:
    - pg_stat_statements

parameters:
  threshold_ms: 500
  minimum_calls: 50

limit: 20

query: |
  SELECT
    queryid,
    calls,
    mean_exec_time,
    total_exec_time,
    rows,
    left(query, 500) AS query_text
  FROM pg_stat_statements
  WHERE calls > @minimum_calls
    AND dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
  ORDER BY mean_exec_time DESC
  LIMIT 50

condition: mean_exec_time > threshold_ms

key:
  - queryid

recommendation:
  title: "Slow query: {{ mean_exec_time | duration }} on average"
  message: "Query {{ queryid }} runs in {{ mean_exec_time | duration }} on average over {{ calls | number }} calls, for a total of {{ total_exec_time | duration }}."
  impact: high
  confidence: high
  evidence:
    - query_text
    - calls
    - mean_exec_time
    - total_exec_time
    - rows
  documentation: https://www.postgresql.org/docs/current/pgstatstatements.html
