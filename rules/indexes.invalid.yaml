id: indexes.invalid
version: 1

name: Invalid index
description: >
  An index left invalid by an interrupted CREATE INDEX CONCURRENTLY. The planner does not use it,
  yet it is still maintained on every write.
category: indexes
severity: warning
group: configuration

requires:
  views:
    - pg_index
    - pg_class

query: |
  SELECT
    n.nspname                    AS schemaname,
    t.relname                    AS tablename,
    i.relname                    AS indexname,
    pg_relation_size(i.oid)      AS index_bytes
  FROM pg_index ix
  JOIN pg_class i ON i.oid = ix.indexrelid
  JOIN pg_class t ON t.oid = ix.indrelid
  JOIN pg_namespace n ON n.oid = t.relnamespace
  WHERE NOT ix.indisvalid
    AND n.nspname NOT IN ('pg_catalog', 'information_schema')
  ORDER BY pg_relation_size(ix.indexrelid) DESC
  LIMIT 100

key:
  - schemaname
  - indexname

recommendation:
  title: "Index invalide : {{ indexname }}"
  message: "{{ indexname }} on {{ schemaname }}.{{ tablename }} is invalid and takes {{ index_bytes | bytes }} without serving any query."
  impact: medium
  confidence: high
  evidence:
    - index_bytes
  sql: "REINDEX INDEX CONCURRENTLY {{ schemaname }}.{{ indexname }};"
  documentation: https://www.postgresql.org/docs/current/sql-createindex.html#SQL-CREATEINDEX-CONCURRENTLY
