id: timescaledb.failed-jobs
version: 1

name: TimescaleDB job failing
description: >
  Compression, retention and continuous-aggregate refresh policies run as background jobs. Their
  failures are silent on the application side.
category: configuration
severity: warning
group: statistics

requires:
  extensions:
    - timescaledb
  views:
    - timescaledb_information.job_stats

query: |
  SELECT
    job_id,
    hypertable_schema,
    hypertable_name,
    last_run_status,
    last_successful_finish,
    total_failures,
    total_runs
  FROM timescaledb_information.job_stats

condition: last_run_status != 'Success' and total_failures > 0

key:
  - job_id

recommendation:
  title: "TimescaleDB job {{ job_id }} is failing"
  message: "Job {{ job_id }} on {{ hypertable_name }} is in status {{ last_run_status }}; {{ total_failures }} failures over {{ total_runs }} runs."
  impact: medium
  confidence: high
  evidence:
    - last_run_status
    - last_successful_finish
    - total_failures
    - total_runs
  documentation: https://docs.timescale.com/use-timescale/latest/jobs/
