id: indexes.missing-foreign-key
version: 1

name: Foreign key without an index
description: >
  An unindexed foreign key forces a full scan of the child table on every delete or update of the
  referenced key, and lengthens locks.
category: indexes
severity: warning
group: configuration

requires:
  views:
    - pg_constraint
    - pg_index
    - pg_class

parameters:
  minimum_size_bytes: 1048576

query: |
  SELECT
    n.nspname                          AS schemaname,
    t.relname                          AS tablename,
    c.conname                          AS constraint_name,
    pg_get_constraintdef(c.oid)        AS definition,
    pg_relation_size(t.oid)            AS table_bytes
  FROM pg_constraint c
  JOIN pg_class t ON t.oid = c.conrelid
  JOIN pg_namespace n ON n.oid = t.relnamespace
  WHERE c.contype = 'f'
    AND n.nspname NOT IN ('pg_catalog', 'information_schema')
    -- No index whose leading columns cover those of the constraint.
    -- indkey is a zero-based int2vector: unnest WITH ORDINALITY avoids depending on its
    -- bounds, unlike slicing the array.
    AND NOT EXISTS (
      SELECT 1
      FROM pg_index i
      WHERE i.indrelid = c.conrelid
        AND i.indisvalid
        AND (
          SELECT array_agg(colonne ORDER BY position)
          FROM unnest(i.indkey::int2[]) WITH ORDINALITY AS prefixe(colonne, position)
          WHERE position <= array_length(c.conkey, 1)
        ) @> c.conkey
    )
    AND pg_relation_size(t.oid) > @minimum_size_bytes
  ORDER BY pg_relation_size(t.oid) DESC
  LIMIT 200

key:
  - schemaname
  - constraint_name

recommendation:
  title: "Unindexed foreign key on {{ schemaname }}.{{ tablename }}"
  message: "Constraint {{ constraint_name }} ({{ definition }}) is covered by no index; the table weighs {{ table_bytes | bytes }}."
  impact: medium
  confidence: high
  evidence:
    - definition
    - table_bytes
  documentation: https://www.postgresql.org/docs/current/ddl-constraints.html#DDL-CONSTRAINTS-FK
