id: extensions.pgstattuple-missing
version: 1

name: pgstattuple is missing
description: >
  Bloat rules rely on planner statistics, which are an estimate. pgstattuple gives the exact
  measure, at the cost of a full read of the relation.
category: extensions
severity: info
group: configuration

requires:
  missingExtensions:
    - pgstattuple

handler: capabilities.missing-extension

key:
  - extension

recommendation:
  title: "Install pgstattuple to measure bloat exactly"
  message: >
    pgstattuple is not available. Bloat rules stay estimates until it is installed.
  impact: low
  confidence: high
  evidence:
    - extension
    - installable
  sql: "CREATE EXTENSION pgstattuple;"
  documentation: https://www.postgresql.org/docs/current/pgstattuple.html
