id: locks.blocking-sessions
version: 1

name: Session blocked by a lock
description: >
  A query waiting on a lock held by another session. Beyond a few seconds, the wait is usually
  worth investigating.
category: locks
severity: critical
group: health

requires:
  views:
    - pg_stat_activity
    - pg_locks

parameters:
  maximum_seconds: 30

query: |
  SELECT
    blocked.pid                                                   AS blocked_pid,
    blocked.usename                                               AS blocked_user,
    left(COALESCE(blocked.query, ''), 300)                        AS blocked_query,
    EXTRACT(EPOCH FROM (now() - blocked.query_start))             AS waiting_seconds,
    blocked.wait_event_type,
    blocked.wait_event,
    blockers.pids                                                 AS blocking_pids
  FROM pg_stat_activity blocked
  CROSS JOIN LATERAL (
    SELECT
      cardinality(pids) AS count,
      (SELECT string_agg(DISTINCT p::text, ', ') FROM unnest(pids) AS p) AS pids
    FROM (SELECT pg_blocking_pids(blocked.pid) AS pids) AS raw
  ) AS blockers
  WHERE blocked.wait_event_type = 'Lock'
    AND now() - blocked.query_start > @maximum_seconds * INTERVAL '1 second'
    AND blockers.count > 0
  ORDER BY blocked.query_start
  LIMIT 100

condition: waiting_seconds > maximum_seconds

key:
  - blocked_pid

recommendation:
  title: "Session {{ blocked_pid }} blocked for {{ waiting_seconds | seconds }}"
  message: "Session {{ blocked_pid }} has been waiting on a lock held by {{ blocking_pids }} for {{ waiting_seconds | seconds }} ({{ wait_event_type }} / {{ wait_event }})."
  impact: high
  confidence: high
  evidence:
    - blocked_user
    - blocked_query
    - blocking_pids
    - wait_event
  documentation: https://www.postgresql.org/docs/current/explicit-locking.html
