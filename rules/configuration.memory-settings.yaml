id: configuration.memory-settings
version: 1

name: Paramètres mémoire laissés par défaut
description: >
  shared_buffers à 128 Mo et work_mem à 4 Mo sont les valeurs de compilation. Elles
  conviennent à une installation d'essai, rarement à une base de production.
category: configuration
severity: warning
group: configuration

requires:
  views:
    - pg_settings

query: |
  SELECT
    (SELECT setting::bigint FROM pg_settings WHERE name = 'shared_buffers')       AS shared_buffers_blocs,
    (SELECT setting::bigint FROM pg_settings WHERE name = 'work_mem')              AS work_mem_ko,
    (SELECT setting::bigint FROM pg_settings WHERE name = 'maintenance_work_mem')  AS maintenance_work_mem_ko,
    (SELECT setting::bigint FROM pg_settings WHERE name = 'effective_cache_size')  AS effective_cache_size_blocs,
    (SELECT setting::bigint FROM pg_settings WHERE name = 'block_size')            AS block_size,
    (SELECT setting::bigint FROM pg_settings WHERE name = 'shared_buffers') *
    (SELECT setting::bigint FROM pg_settings WHERE name = 'block_size')            AS shared_buffers_octets

condition: shared_buffers_octets <= 134217728 and work_mem_ko <= 4096

recommendation:
  title: "Paramètres mémoire aux valeurs par défaut"
  message: "shared_buffers vaut {{ shared_buffers_octets | bytes }} et work_mem {{ work_mem_ko }} kB. Une base de production part généralement de 25 % de la RAM pour shared_buffers."
  impact: medium
  confidence: medium
  evidence:
    - shared_buffers_octets
    - work_mem_ko
    - maintenance_work_mem_ko
    - effective_cache_size_blocs
  documentation: https://www.postgresql.org/docs/current/runtime-config-resource.html
