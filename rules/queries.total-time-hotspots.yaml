id: queries.total-time-hotspots
version: 1

name: Queries costliest in total time
description: >
  A fast but heavily called query can consume more server time than a slow, rare one. This ranking
  is on cumulative time.
category: queries
severity: info
group: recommendations

requires:
  extensions:
    - pg_stat_statements
  views:
    - pg_stat_statements
  # mean_exec_time et total_exec_time s'appellent mean_time et total_time avant
  # pg_stat_statements 1.8, livré avec PostgreSQL 13. requires.extensions ne vérifie que la
  # présence de l'extension, jamais sa version : sans cette borne, la règle échoue en 42703 à
  # chaque exécution jusqu'à sa mise en quarantaine.
  minVersion: 13

parameters:
  minimum_share: 0.15

limit: 10

query: |
  WITH total AS (
    SELECT SUM(total_exec_time) AS cumul
    FROM pg_stat_statements
    WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
  )
  SELECT
    s.queryid,
    s.calls,
    s.total_exec_time,
    s.mean_exec_time,
    left(s.query, 500) AS query_text,
    s.total_exec_time / NULLIF(t.cumul, 0) AS share
  FROM pg_stat_statements s
  CROSS JOIN total t
  WHERE s.dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
  ORDER BY s.total_exec_time DESC
  LIMIT 20

condition: share > minimum_share

key:
  - queryid

recommendation:
  title: "{{ share | percent }} of server time for a single query"
  message: "Query {{ queryid }} accounts for {{ share | percent }} of cumulative execution time ({{ total_exec_time | duration }} over {{ calls | number }} calls)."
  impact: high
  confidence: high
  evidence:
    - query_text
    - calls
    - total_exec_time
    - mean_exec_time
    - share
  documentation: https://www.postgresql.org/docs/current/pgstatstatements.html
