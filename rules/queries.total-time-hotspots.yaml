id: queries.total-time-hotspots
version: 1

name: Requêtes les plus coûteuses au cumul
description: >
  Une requête rapide mais très appelée peut consommer plus de temps serveur qu'une requête
  lente et rare. Ce classement porte sur le temps cumulé.
category: queries
severity: info
group: recommendations

requires:
  extensions:
    - pg_stat_statements
  views:
    - pg_stat_statements

parameters:
  part_minimum: 0.15

limit: 10

query: |
  WITH total AS (
    SELECT SUM(total_exec_time) AS cumul
    FROM pg_stat_statements
    WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
  )
  SELECT
    s.queryid,
    s.calls,
    s.total_exec_time,
    s.mean_exec_time,
    left(s.query, 500) AS query_text,
    s.total_exec_time / NULLIF(t.cumul, 0) AS part
  FROM pg_stat_statements s
  CROSS JOIN total t
  WHERE s.dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
  ORDER BY s.total_exec_time DESC
  LIMIT 20

condition: part > part_minimum

key:
  - queryid

recommendation:
  title: "{{ part | percent }} du temps serveur pour une seule requête"
  message: "La requête {{ queryid }} concentre {{ part | percent }} du temps d'exécution cumulé ({{ total_exec_time | duration }} sur {{ calls | number }} appels)."
  impact: high
  confidence: high
  evidence:
    - query_text
    - calls
    - total_exec_time
    - mean_exec_time
    - part
  documentation: https://www.postgresql.org/docs/current/pgstatstatements.html
