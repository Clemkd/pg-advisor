id: configuration.durability-relaxed
version: 1

name: Garanties de durabilité affaiblies
description: >
  fsync, full_page_writes ou synchronous_commit désactivés exposent la base à une corruption
  ou à une perte de transactions validées en cas d'arrêt brutal.
category: configuration
severity: critical
group: configuration

requires:
  views:
    - pg_settings

query: |
  SELECT name, setting, source, short_desc
  FROM pg_settings
  WHERE name IN ('fsync', 'full_page_writes', 'synchronous_commit')

condition: setting == 'off'

key:
  - name

recommendation:
  title: "Paramètre de durabilité désactivé : {{ name }}"
  message: "{{ name }} vaut « off » (source : {{ source }}). Un arrêt brutal peut entraîner une perte de données ou une corruption."
  impact: high
  confidence: high
  evidence:
    - setting
    - source
    - short_desc
  sql: "ALTER SYSTEM SET {{ name }} = on; SELECT pg_reload_conf();"
  documentation: https://www.postgresql.org/docs/current/runtime-config-wal.html
