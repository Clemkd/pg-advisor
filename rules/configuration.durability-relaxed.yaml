id: configuration.durability-relaxed
version: 1

name: Weakened durability guarantees
description: >
  Disabling fsync, full_page_writes or synchronous_commit exposes the database to corruption, or
  to losing committed transactions, on an abrupt shutdown.
category: configuration
severity: critical
group: configuration

requires:
  views:
    - pg_settings

query: |
  SELECT name, setting, source, short_desc
  FROM pg_settings
  WHERE name IN ('fsync', 'full_page_writes', 'synchronous_commit')

condition: setting == 'off'

key:
  - name

recommendation:
  title: "Durability setting turned off: {{ name }}"
  message: "{{ name }} is 'off' (source: {{ source }}). An abrupt shutdown may cause data loss or corruption."
  impact: high
  confidence: high
  evidence:
    - setting
    - source
    - short_desc
  sql: "ALTER SYSTEM SET {{ name }} = on; SELECT pg_reload_conf();"
  documentation: https://www.postgresql.org/docs/current/runtime-config-wal.html
