id: connections.idle-in-transaction
version: 1

name: Session idle in transaction
description: >
  An open, idle transaction holds on to dead rows, keeps vacuum from reclaiming them, and can
  block other sessions.
category: connections
severity: warning
group: health

requires:
  views:
    - pg_stat_activity

parameters:
  maximum_seconds: 300

query: |
  SELECT
    pid,
    usename,
    application_name,
    client_addr::text                                       AS client,
    state,
    EXTRACT(EPOCH FROM (now() - state_change))              AS idle_seconds,
    EXTRACT(EPOCH FROM (now() - xact_start))                AS transaction_seconds
  FROM pg_stat_activity
  WHERE state IN ('idle in transaction', 'idle in transaction (aborted)')

condition: idle_seconds > maximum_seconds

key:
  - pid

recommendation:
  title: "Session {{ pid }} idle in transaction for {{ idle_seconds | seconds }}"
  message: "Session {{ pid }} ({{ usename }} / {{ application_name }}) has been {{ state }} for {{ idle_seconds | seconds }}. It is holding back dead-row cleanup."
  impact: medium
  confidence: high
  evidence:
    - usename
    - application_name
    - client
    - state
    - transaction_seconds
  sql: "SELECT pg_terminate_backend({{ pid }}); -- only after checking with the application"
  documentation: https://www.postgresql.org/docs/current/runtime-config-client.html#GUC-IDLE-IN-TRANSACTION-SESSION-TIMEOUT
