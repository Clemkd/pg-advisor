id: security.md5-passwords
version: 1

name: Passwords hashed with MD5
description: >
  MD5 is still accepted for compatibility, but SCRAM-SHA-256 has been the recommended mechanism
  since PostgreSQL 10.
category: security
severity: warning
group: configuration

requires:
  views:
    - pg_settings

query: |
  SELECT setting, source
  FROM pg_settings
  WHERE name = 'password_encryption'

condition: setting == 'md5'

recommendation:
  title: "Passwords hashed with MD5"
  message: "password_encryption is '{{ setting }}' (source: {{ source }}). Switch to scram-sha-256, then have passwords reset."
  impact: medium
  confidence: high
  evidence:
    - setting
    - source
  sql: "ALTER SYSTEM SET password_encryption = 'scram-sha-256'; SELECT pg_reload_conf();"
  documentation: https://www.postgresql.org/docs/current/auth-password.html
