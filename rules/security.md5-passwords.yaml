id: security.md5-passwords
version: 1

name: Chiffrement des mots de passe en MD5
description: >
  MD5 reste accepté pour compatibilité mais SCRAM-SHA-256 est le mécanisme recommandé depuis
  PostgreSQL 10.
category: security
severity: warning
group: configuration

requires:
  views:
    - pg_settings

query: |
  SELECT setting, source
  FROM pg_settings
  WHERE name = 'password_encryption'

condition: setting == 'md5'

recommendation:
  title: "Mots de passe chiffrés en MD5"
  message: "password_encryption vaut « {{ setting }} » (source : {{ source }}). Basculer sur scram-sha-256 puis faire réinitialiser les mots de passe."
  impact: medium
  confidence: high
  evidence:
    - setting
    - source
  sql: "ALTER SYSTEM SET password_encryption = 'scram-sha-256'; SELECT pg_reload_conf();"
  documentation: https://www.postgresql.org/docs/current/auth-password.html
