id: storage.largest-relations
version: 1

name: Largest relations
description: >
  An inventory of tables above a size threshold, indexes included. Serves as a reference point for
  backups, retention and partitioning.
category: storage
severity: info
group: configuration

requires:
  views:
    - pg_class

parameters:
  minimum_size_bytes: 1073741824

limit: 20

query: |
  SELECT
    n.nspname                                    AS schemaname,
    c.relname,
    pg_total_relation_size(c.oid)                AS total_bytes,
    pg_relation_size(c.oid)                      AS table_octets,
    pg_indexes_size(c.oid)                       AS index_bytes,
    c.reltuples::bigint                          AS estimated_rows
  FROM pg_class c
  JOIN pg_namespace n ON n.oid = c.relnamespace
  WHERE c.relkind IN ('r', 'p', 'm')
    AND n.nspname NOT IN ('pg_catalog', 'information_schema', 'pg_toast')
  ORDER BY pg_total_relation_size(c.oid) DESC
  LIMIT 50

condition: total_bytes > minimum_size_bytes

key:
  - schemaname
  - relname

recommendation:
  title: "{{ schemaname }}.{{ relname }} occupe {{ total_bytes | bytes }}"
  message: "{{ relname }} totals {{ total_bytes | bytes }}, of which {{ index_bytes | bytes }} is indexes, for roughly {{ estimated_rows | number }} rows."
  impact: low
  confidence: high
  evidence:
    - total_bytes
    - table_octets
    - index_bytes
    - estimated_rows
  documentation: https://www.postgresql.org/docs/current/disk-usage.html
