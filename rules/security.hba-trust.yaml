id: security.hba-trust
version: 1

name: trust authentication in pg_hba.conf
description: >
  A trust line accepts any matching connection without a password. Requires access to
  pg_hba_file_rules, which is restricted to privileged roles.
category: security
severity: critical
group: configuration

requires:
  views:
    - pg_hba_file_rules
  monitorRole: true

query: |
  SELECT
    line_number,
    type,
    COALESCE(array_to_string(database, ','), 'all')  AS databases,
    COALESCE(array_to_string(user_name, ','), 'all') AS users,
    COALESCE(address, 'local')                       AS address,
    auth_method
  FROM pg_hba_file_rules
  WHERE auth_method = 'trust'

condition: not (type == 'local' and address == 'local')

key:
  - line_number

recommendation:
  title: "Authentification trust ligne {{ line_number }} de pg_hba.conf"
  message: "The {{ type }} {{ databases }} {{ users }} rule from {{ address }} accepts connections without a password."
  impact: high
  confidence: high
  evidence:
    - type
    - databases
    - users
    - address
    - auth_method
  documentation: https://www.postgresql.org/docs/current/auth-pg-hba-conf.html
