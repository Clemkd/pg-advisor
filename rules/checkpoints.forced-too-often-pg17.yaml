id: checkpoints.forced-too-often-pg17
version: 1

name: Checkpoints forced by WAL volume (PostgreSQL 17+)
description: >
  Same diagnostic as checkpoints.forced-too-often, against pg_stat_checkpointer: the checkpoint
  counters left pg_stat_bgwriter in PostgreSQL 17.
category: checkpoints
severity: warning
group: statistics

requires:
  views:
    - pg_stat_checkpointer
  minVersion: 17

parameters:
  maximum_share: 0.3
  minimum_checkpoints: 10

query: |
  SELECT
    num_timed,
    num_requested,
    num_requested::float / NULLIF(num_timed + num_requested, 0) AS forced_share
  FROM pg_stat_checkpointer

condition: num_timed + num_requested > minimum_checkpoints and forced_share > maximum_share

recommendation:
  title: "{{ forced_share | percent }} of checkpoints are forced"
  message: "{{ num_requested }} checkpoints out of {{ num_timed }} scheduled were triggered by WAL volume. Raising max_wal_size smooths the writes."
  impact: medium
  confidence: high
  evidence:
    - num_timed
    - num_requested
    - forced_share
  sql: "ALTER SYSTEM SET max_wal_size = '4GB'; SELECT pg_reload_conf();"
  documentation: https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-CHECKPOINTER-VIEW
