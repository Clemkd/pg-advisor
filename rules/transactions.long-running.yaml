id: transactions.long-running
version: 1

name: Long-running transaction
description: >
  A transaction held open for a long time keeps vacuum from reclaiming dead rows across the whole
  instance, not only on the tables it touches.
category: transactions
severity: warning
group: health

requires:
  views:
    - pg_stat_activity

parameters:
  maximum_seconds: 900

query: |
  SELECT
    pid,
    usename,
    application_name,
    state,
    EXTRACT(EPOCH FROM (now() - xact_start))       AS transaction_seconds,
    left(COALESCE(query, ''), 300)                 AS query
  FROM pg_stat_activity
  WHERE xact_start IS NOT NULL
    AND backend_type = 'client backend'
    AND pid <> pg_backend_pid()

condition: transaction_seconds > maximum_seconds

key:
  - pid

recommendation:
  title: "Transaction open for {{ transaction_seconds | seconds }}"
  message: "Session {{ pid }} ({{ usename }} / {{ application_name }}) has held a transaction for {{ transaction_seconds | seconds }}, state {{ state }}."
  impact: high
  confidence: high
  evidence:
    - usename
    - application_name
    - state
    - query
  documentation: https://www.postgresql.org/docs/current/routine-vacuuming.html
