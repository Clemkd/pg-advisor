id: vacuum.dead-tuples
version: 1

name: Dead rows accumulating
description: >
  A high dead-row ratio means autovacuum is not keeping up with writes. Reads then walk over
  useless pages, and the table grows.
category: vacuum
severity: warning
group: recommendations

requires:
  views:
    - pg_stat_user_tables

parameters:
  minimum_ratio: 0.20
  minimum_rows: 10000

query: |
  SELECT
    schemaname,
    relname,
    n_dead_tup,
    n_live_tup,
    last_autovacuum,
    last_vacuum,
    n_dead_tup::float / NULLIF(n_live_tup, 0) AS ratio
  FROM pg_stat_user_tables
  WHERE n_live_tup > @minimum_rows
    AND n_dead_tup::float / NULLIF(n_live_tup, 0) > @minimum_ratio
  ORDER BY n_dead_tup DESC
  LIMIT 200

condition: ratio > minimum_ratio

key:
  - schemaname
  - relname

recommendation:
  title: "Autovacuum en retard sur {{ schemaname }}.{{ relname }}"
  message: "{{ relname }} holds {{ ratio | percent }} dead rows ({{ n_dead_tup | number }} out of {{ n_live_tup | number }} live)."
  impact: medium
  confidence: high
  evidence:
    - n_dead_tup
    - n_live_tup
    - ratio
    - last_autovacuum
  sql: "VACUUM (ANALYZE) {{ schemaname }}.{{ relname }};"
  documentation: https://www.postgresql.org/docs/current/routine-vacuuming.html
