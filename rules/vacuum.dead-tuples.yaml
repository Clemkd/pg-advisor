id: vacuum.dead-tuples
version: 1

name: Lignes mortes accumulées
description: >
  Un ratio élevé de lignes mortes indique un autovacuum qui ne suit pas le rythme des
  écritures. Les lectures parcourent alors des pages inutiles et la table grossit.
category: vacuum
severity: warning
group: recommendations

requires:
  views:
    - pg_stat_user_tables

parameters:
  ratio_minimum: 0.20
  lignes_minimum: 10000

query: |
  SELECT
    schemaname,
    relname,
    n_dead_tup,
    n_live_tup,
    last_autovacuum,
    last_vacuum,
    n_dead_tup::float / NULLIF(n_live_tup, 0) AS ratio
  FROM pg_stat_user_tables
  WHERE n_live_tup > @lignes_minimum
  ORDER BY n_dead_tup DESC

condition: ratio > ratio_minimum

key:
  - schemaname
  - relname

recommendation:
  title: "Autovacuum en retard sur {{ schemaname }}.{{ relname }}"
  message: "{{ relname }} présente {{ ratio | percent }} de lignes mortes ({{ n_dead_tup | number }} sur {{ n_live_tup | number }} vivantes)."
  impact: medium
  confidence: high
  evidence:
    - n_dead_tup
    - n_live_tup
    - ratio
    - last_autovacuum
  sql: "VACUUM (ANALYZE) {{ schemaname }}.{{ relname }};"
  documentation: https://www.postgresql.org/docs/current/routine-vacuuming.html
