id: vacuum.wraparound-risk
version: 1

name: Approche du wraparound des transactions
description: >
  L'âge de la plus vieille transaction gelée approche autovacuum_freeze_max_age. Au-delà,
  PostgreSQL déclenche des vacuums d'urgence puis refuse les écritures.
category: vacuum
severity: critical
group: configuration

requires:
  views:
    - pg_class
    - pg_settings

parameters:
  part_maximum: 0.7

query: |
  SELECT
    n.nspname                                                          AS schemaname,
    c.relname,
    age(c.relfrozenxid)                                                AS age_xid,
    (SELECT setting::bigint FROM pg_settings WHERE name = 'autovacuum_freeze_max_age') AS limite,
    age(c.relfrozenxid)::float /
      (SELECT setting::bigint FROM pg_settings WHERE name = 'autovacuum_freeze_max_age') AS part
  FROM pg_class c
  JOIN pg_namespace n ON n.oid = c.relnamespace
  WHERE c.relkind IN ('r', 'm', 't')
    AND n.nspname NOT IN ('information_schema')
  ORDER BY age(c.relfrozenxid) DESC
  LIMIT 20

condition: part > part_maximum

key:
  - schemaname
  - relname

recommendation:
  title: "Wraparound proche sur {{ schemaname }}.{{ relname }}"
  message: "L'âge des transactions de {{ relname }} atteint {{ age_xid | number }}, soit {{ part | percent }} de autovacuum_freeze_max_age ({{ limite | number }})."
  impact: high
  confidence: high
  evidence:
    - age_xid
    - limite
    - part
  sql: "VACUUM (FREEZE, VERBOSE) {{ schemaname }}.{{ relname }};"
  documentation: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-WRAPAROUND
