id: vacuum.wraparound-risk
version: 1

name: Approaching transaction wraparound
description: >
  The age of the oldest frozen transaction is approaching autovacuum_freeze_max_age. Past it,
  PostgreSQL triggers emergency vacuums and then refuses writes.
category: vacuum
severity: critical
group: configuration

requires:
  views:
    - pg_class
    - pg_settings

parameters:
  maximum_share: 0.7

query: |
  SELECT
    n.nspname                                                          AS schemaname,
    c.relname,
    age(c.relfrozenxid)                                                AS age_xid,
    (SELECT setting::bigint FROM pg_settings WHERE name = 'autovacuum_freeze_max_age') AS freeze_max_age,
    age(c.relfrozenxid)::float /
      (SELECT setting::bigint FROM pg_settings WHERE name = 'autovacuum_freeze_max_age') AS share
  FROM pg_class c
  JOIN pg_namespace n ON n.oid = c.relnamespace
  WHERE c.relkind IN ('r', 'm', 't')
    AND n.nspname NOT IN ('information_schema')
  ORDER BY age(c.relfrozenxid) DESC
  LIMIT 20

condition: share > maximum_share

key:
  - schemaname
  - relname

recommendation:
  title: "Wraparound proche sur {{ schemaname }}.{{ relname }}"
  message: "Transaction age on {{ relname }} has reached {{ age_xid | number }}, that is {{ share | percent }} of autovacuum_freeze_max_age ({{ freeze_max_age | number }})."
  impact: high
  confidence: high
  evidence:
    - age_xid
    - freeze_max_age
    - share
  sql: "VACUUM (FREEZE, VERBOSE) {{ schemaname }}.{{ relname }};"
  documentation: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-WRAPAROUND
