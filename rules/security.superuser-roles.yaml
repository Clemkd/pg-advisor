id: security.superuser-roles
version: 1

name: Many superuser roles
description: >
  A superuser bypasses every permission check, including row-level security. Each one widens the
  blast radius of a compromise.
category: security
severity: warning
group: configuration

requires:
  views:
    - pg_roles

parameters:
  maximum: 2

query: |
  SELECT
    count(*)                                       AS count,
    string_agg(rolname, ', ' ORDER BY rolname)     AS roles
  FROM pg_roles
  WHERE rolsuper
    AND rolcanlogin

condition: count > maximum

recommendation:
  title: "{{ count }} superuser roles can log in"
  message: "Roles concerned: {{ roles }}. Restricting the rights of application accounts limits the reach of a compromise."
  impact: medium
  confidence: medium
  evidence:
    - count
    - roles
  documentation: https://www.postgresql.org/docs/current/role-attributes.html
