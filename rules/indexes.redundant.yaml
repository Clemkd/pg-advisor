id: indexes.redundant
version: 1

name: Redundant index
description: >
  An index whose columns form the prefix of another index on the same table: queries using it can
  rely on the wider one. Detection is delegated to a handler, since it correlates rows with one
  another.
category: indexes
severity: info
group: recommendations

requires:
  views:
    - pg_index
    - pg_class

handler: indexes.redundant

key:
  - schemaname
  - indexname

recommendation:
  title: "Index redondant : {{ indexname }}"
  message: "{{ indexname }} ({{ index_bytes | bytes }}) est couvert par {{ covering_index }} sur {{ schemaname }}.{{ tablename }}."
  impact: low
  confidence: medium
  evidence:
    - covering_index
    - index_bytes
    - idx_scan
    - columns
  sql: "DROP INDEX CONCURRENTLY {{ schemaname }}.{{ indexname }};"
  documentation: https://www.postgresql.org/docs/current/indexes-multicolumn.html
