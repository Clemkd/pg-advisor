id: configuration.autovacuum-disabled
version: 1

name: Autovacuum disabled
description: >
  Without autovacuum, dead rows are never reclaimed and the instance eventually runs into
  transaction wraparound.
category: configuration
severity: critical
group: configuration

requires:
  views:
    - pg_settings

query: |
  SELECT name, setting, source
  FROM pg_settings
  WHERE name = 'autovacuum'

condition: setting == 'off'

key:
  - name

recommendation:
  title: "Autovacuum is disabled on the instance"
  message: "The autovacuum setting is '{{ setting }}' (source: {{ source }}). Dead rows will no longer be cleaned up automatically."
  impact: high
  confidence: high
  evidence:
    - setting
    - source
  sql: "ALTER SYSTEM SET autovacuum = on; SELECT pg_reload_conf();"
  documentation: https://www.postgresql.org/docs/current/runtime-config-autovacuum.html
