id: performance.cache-hit-ratio
version: 2

name: Low cache hit ratio
description: >
  The share of blocks served from shared buffers. A lastingly low ratio points to a shared_buffers
  too small for the volume actually read.
category: performance
severity: warning
group: statistics

requires:
  views:
    - pg_stat_database

parameters:
  threshold: 0.95
  minimum_reads: 100000

query: |
  SELECT
    datname,
    blks_hit,
    blks_read,
    blks_hit::float / NULLIF(blks_hit + blks_read, 0) AS ratio
  FROM pg_stat_database
  WHERE datname = current_database()
    AND blks_hit + blks_read > @minimum_reads

condition: blks_hit_delta + blks_read_delta > minimum_reads
  and blks_hit_delta / (blks_hit_delta + blks_read_delta) < threshold

recommendation:
  title: "Cache hit ratio of {{ ratio | percent }}"
  message: "On {{ datname }}, {{ blks_read_delta | number }} block reads went to disk since the previous measurement, against {{ blks_hit_delta | number }} served from cache. A larger shared_buffers or more selective queries would cut disk reads."
  impact: medium
  confidence: medium
  evidence:
    - blks_hit_delta
    - blks_read_delta
    - blks_hit
    - blks_read
    - ratio
  documentation: https://www.postgresql.org/docs/current/runtime-config-resource.html#GUC-SHARED-BUFFERS
