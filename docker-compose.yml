services:
  pg-advisor:
    build: .
    image: pg-advisor
    ports:
      # Port publié sur l'hôte, surchargeable : PGADVISOR_PORT=9090 docker compose up -d.
      # Le port interne reste 8080 — l'application écoute là où son image l'attend.
      - "${PGADVISOR_PORT:-8080}:8080"
    volumes:
      # SQLite + règles créées depuis l'IHM
      - advisor-data:/app/data
      # Règles fournies par l'opérateur, lecture seule
      - ./rules:/app/rules:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  advisor-data:
