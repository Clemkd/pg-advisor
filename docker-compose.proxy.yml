# Surcouche pour un déploiement derrière un proxy — Traefik, Caddy, Coolify, autre.
#
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# Elle ne fait qu'une chose : ne rien publier sur l'hôte. Le proxy joint le conteneur par le
# réseau Docker, sur son port interne ; publier en plus ouvrirait un second chemin vers
# l'application, hors du proxy, donc sans TLS ni middleware.
#
# Le routage n'est pas décrit ici : selon la plateforme il vient de labels posés automatiquement
# (Coolify), d'un fichier de configuration du proxy, ou de labels écrits à la main.
services:
  pg-advisor:
    # `!reset` et non une liste vide : Compose concatène les listes, et une liste vide laisserait
    # le port du fichier de base en place — exactement le chemin qu'on veut fermer.
    ports: !reset []
