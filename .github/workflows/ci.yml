name: CI

on:
  # Toutes les branches, pas seulement main : limiter le déclenchement à main et aux pull requests
  # ne donnait aucun retour tant qu'une PR n'était pas ouverte — et laissait le workflow lui-même
  # sans preuve d'exécution. La concurrence ci-dessous annule le run précédent d'une même branche.
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La version vient de global.json : la CI et les postes de travail compilent avec le
      # même SDK, sans quoi un avertissement peut apparaître d'un côté seulement.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore PgAdvisor.slnx

      - run: dotnet build PgAdvisor.slnx -c Release --no-restore

      - run: dotnet test PgAdvisor.slnx -c Release --no-build --logger trx --results-directory artifacts/tests

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/tests
          if-no-files-found: ignore

  web:
    name: SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/pg-advisor-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/pg-advisor-web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # `tsc -b` fait partie du script de build : la compilation des types est donc couverte.
      - run: npm run build

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Construite mais jamais publiée : l'objectif est de détecter une régression du Dockerfile,
      # pas de livrer.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
